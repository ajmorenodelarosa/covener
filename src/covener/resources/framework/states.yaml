# Covener state model. Code validates it; agents reason within it.
version: 1

spec:                       # specs/[<domain>/]<name>.md -> status:   what the product is (living)
  states: [draft, approved, done]
  transitions:
    draft: [approved]       # human approves the text
    approved: [draft, done] # done only after a change implemented it and the human approved the work
    done: [draft]           # editing a done spec (extend, change or remove a requirement) reopens it
  human_gated: [[draft, approved], [approved, done]]

bug:                        # bugs/<id>.md -> status:    what is wrong
  states: [open, done]
  transitions: { open: [done], done: [] }
  human_gated: [[open, done]]

task:                       # tasks/<id>.md -> status:   work that changes neither
  states: [open, done]
  transitions: { open: [done], done: [] }
  human_gated: [[open, done]]

change:                     # changes/<name>/change.md -> status:   the unit of work
  states: [open, review, done]
  transitions:
    open: [review]          # agents finished; feedback requested
    review: [open, done]
  human_gated: [[review, done]]
  rules:
    - a change takes approved specs, open bugs and open tasks
    - an item is in at most one open change
    - a change is done only when its work log ends with "Approved: Yes"
    - "`covener change archive <name>` refuses without that approval, then marks the items done and moves the change to changes/archive/YYYY-MM-DD-<name>/"

work:                       # derived from changes/<name>/work.md, never stored
  states: [not_started, in_progress, awaiting_feedback, changes_requested, approved]
  rule: 'the last "## ..." entry decides (the ## Checklist does not count); a "## Feedback" entry carries Approved: Yes or No'
